# Enables remote-write of OTLP metrics to a Prometheus-compatible endpoint.
# Only included when CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT is set.
#
# entrypoint.sh strips any http:// or https:// scheme from
# CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT and exports it as
# HYPERDX_PROMETHEUS_SCHEME / HYPERDX_PROMETHEUS_TLS_INSECURE. The defaults
# keep plain HTTP if those are unset.
#
# Mirrors the OpAMP-managed behavior in
# packages/api/src/opamp/controllers/opampController.ts (gated on
# IS_PROMQL_ENABLED). When updating this file, keep it in sync with
# buildOtelCollectorConfig().

exporters:
  prometheusremotewrite:
    endpoint: ${env:HYPERDX_PROMETHEUS_SCHEME:-http}://${env:CLICKHOUSE_PROMETHEUS_METRICS_ENDPOINT}/write
    tls:
      insecure: ${env:HYPERDX_PROMETHEUS_TLS_INSECURE:-true}
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics/promql:
      receivers: [otlp/hyperdx]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
